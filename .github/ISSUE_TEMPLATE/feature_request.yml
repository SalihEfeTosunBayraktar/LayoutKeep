name: Feature request
description: Something the application should do and does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what stopped you. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think would solve it
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: A workaround tells us how much the gap costs.
