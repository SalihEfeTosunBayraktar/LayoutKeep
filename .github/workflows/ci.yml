name: CI

on:
  push:
    # The default branch here is master; a workflow that only watches main never runs.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at 10x Linux minutes. Keep it here while the repo is public;
        # move it behind tags if the repo ever goes private. See docs/PACKAGING.md.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 is the target. 3.14 breaks the phase-2 OCR dependencies.
          python-version: "3.13"
          cache: pip

      # PySide6 ships its own Qt but links against the system's graphics libraries, which a
      # headless Linux runner does not have. Without these the import fails with
      # "libEGL.so.1: cannot open shared object file" before a single test runs - offscreen
      # rendering still needs the library, it just does not need a display.
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install
        run: python -m pip install -e ".[pdf,epub,ui,fitting,dev]"

      # A headless Linux runner has no keychain, so `keyring` raises NoKeyringError and
      # every test of the API-key store fails on an environment problem rather than on
      # anything about the code. A file backend gives those tests something real to write
      # to. It is plaintext, which is exactly what the application refuses to do with a
      # real key - here the keys are fixtures and the machine is thrown away afterwards.
      - name: Keyring backend (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install keyrings.alt
          # Exported from here rather than set on the test step, because a step-level `env:`
          # with a conditional expression still defines the variable on the other platforms -
          # as an empty string - and keyring then tries to import a module named "" and dies
          # with "ValueError: Empty module name". Windows and macOS have a real keychain and
          # must be left to use it.
          echo "PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring" >> "$GITHUB_ENV"

      - name: Lint
        run: python -m ruff check src/ tools/ tests/

      - name: Test
        # Qt needs an offscreen platform plugin on headless runners.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --junitxml=test-results.xml

      - name: Check licences
        # The project is AGPL-3.0. A dependency under a non-commercial or RAIL licence
        # would be incompatible, and that is far cheaper to catch here than later.
        run: |
          python -m pip install pip-licenses
          python -m piplicenses --format=markdown --with-urls

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  package:
    # A wheel that does not build, or one that leaves out the fonts and the typing marker, is a
    # release that fails on someone else's machine. Cheaper to catch on every push.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build the distribution
        run: |
          python -m pip install build twine
          python -m build

      - name: Check its metadata
        run: python -m twine check dist/*

      - name: Check what it carries
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(n.endswith("py.typed") for n in names), "typing marker missing"
          assert sum(1 for n in names if n.endswith(".ttf")) >= 10, "substitute fonts missing"
          print(f"{wheel}: {len(names)} entries, fonts and typing marker present")
          PY

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install -e ".[pdf,epub,ui,fitting]"
          python -m pip install pyinstaller

      - name: Build
        run: python -m PyInstaller packaging/layoutkeep.spec --noconfirm

      # The build is UNSIGNED. Windows SmartScreen will warn users who run it.
      # Signing needs a certificate the project does not have - see docs/PACKAGING.md.
      - uses: actions/upload-artifact@v4
        with:
          name: LayoutKeep-windows-unsigned
          path: dist/LayoutKeep/
