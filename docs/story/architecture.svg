<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">LayoutKeep — çeviri hattı</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#6b7280">oku → DocIR → çevir → sığdır → yaz → denetle</text>

  <!-- okuyucular -->
  <rect x="30" y="100" width="215" height="150" rx="12" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="137" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Okuyucular</text>
  <text x="137" y="154" text-anchor="middle" font-size="12.5" fill="#374151">PDF · EPUB · DOCX</text>
  <text x="137" y="176" text-anchor="middle" font-size="12.5" fill="#374151">PNG/JPG (OCR yolu)</text>
  <text x="137" y="204" text-anchor="middle" font-size="12" fill="#6b7280">hizalama · kod/formül</text>
  <text x="137" y="224" text-anchor="middle" font-size="12" fill="#6b7280">IBM Docling Heron (taramada)</text>

  <!-- DocIR -->
  <rect x="280" y="100" width="190" height="150" rx="12" fill="#f3f0ff" stroke="#c4b5fd"/>
  <text x="375" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">DocIR</text>
  <text x="375" y="154" text-anchor="middle" font-size="12.5" fill="#374151">biçimden bağımsız</text>
  <text x="375" y="174" text-anchor="middle" font-size="12.5" fill="#374151">belge modeli</text>
  <text x="375" y="202" text-anchor="middle" font-size="12" fill="#6b7280">kutu · stil · görsel</text>
  <text x="375" y="222" text-anchor="middle" font-size="12" fill="#6b7280">segment · çeviri</text>

  <!-- sağlayıcı zinciri -->
  <rect x="505" y="100" width="225" height="150" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="617" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">Sağlayıcı zinciri</text>
  <text x="617" y="152" text-anchor="middle" font-size="12.5" fill="#374151">dedupe → bellek → koru</text>
  <text x="617" y="172" text-anchor="middle" font-size="12.5" fill="#374151">→ yeniden sor → parçala</text>
  <text x="617" y="200" text-anchor="middle" font-size="12" fill="#6b7280">yerel LM Studio (7 yuva)</text>
  <text x="617" y="220" text-anchor="middle" font-size="12" fill="#6b7280">veya OpenAI uyumlu uç nokta</text>

  <!-- sığdırma + yazma -->
  <rect x="765" y="100" width="205" height="150" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="867" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">Sığdır ve yaz</text>
  <text x="867" y="152" text-anchor="middle" font-size="12.5" fill="#374151">küçült → kısalt iste</text>
  <text x="867" y="172" text-anchor="middle" font-size="12.5" fill="#374151">→ (reflow) → işaretle</text>
  <text x="867" y="200" text-anchor="middle" font-size="12" fill="#6b7280">PDF · DOCX · EPUB</text>

  <!-- oklar: çizgi + üçgen uç -->
  <line x1="247" y1="175" x2="272" y2="175" stroke="#6b7280" stroke-width="1.6"/>
  <path d="M272,169 L282,175 L272,181 z" fill="#6b7280"/>
  <line x1="472" y1="175" x2="497" y2="175" stroke="#6b7280" stroke-width="1.6"/>
  <path d="M497,169 L507,175 L497,181 z" fill="#6b7280"/>
  <line x1="732" y1="175" x2="757" y2="175" stroke="#6b7280" stroke-width="1.6"/>
  <path d="M757,169 L767,175 L757,181 z" fill="#6b7280"/>

  <!-- denetleyici -->
  <rect x="250" y="305" width="500" height="180" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="500" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">Denetleyici (verify.py)</text>
  <text x="500" y="360" text-anchor="middle" font-size="12.5" fill="#374151">L1 sayfa · L2 çevrilmemiş · L3 düşen blok · L4 sayfa dışı · L5 işaret</text>
  <text x="500" y="380" text-anchor="middle" font-size="12.5" fill="#374151">L6 sayı · L7 üst üste metin · L8 taşınan · L9 bozuk harf · L10 görsel üstü</text>
  <text x="500" y="400" text-anchor="middle" font-size="12.5" fill="#374151">D1 okunabilirlik tabanı · D2 kısa bloklar · D3 sıkışan satır</text>
  <text x="500" y="430" text-anchor="middle" font-size="12.5" fill="#6b7280">kaybedileni yeniden sorar (ask_again)</text>
  <text x="500" y="452" text-anchor="middle" font-size="12.5" fill="#6b7280">kalanı inceleme kuyruğuna yazar · audit.json üretir</text>

  <!-- yazma → denetleyici -->
  <line x1="867" y1="252" x2="867" y2="395" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="867" y1="395" x2="760" y2="395" stroke="#6b7280" stroke-width="1.6"/>
  <path d="M760,389 L750,395 L760,401 z" fill="#6b7280"/>

  <!-- geri besleme: denetleyici → okuyucular -->
  <path d="M250 395 L137 395 L137 262" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
  <path d="M131,262 L137,252 L143,262 z" fill="#6b7280"/>
  <rect x="152" y="378" width="96" height="20" fill="#ffffff"/>
  <text x="200" y="392" text-anchor="middle" font-size="12" fill="#6b7280">kaynak ↔ çıktı</text>

  <!-- alt notlar -->
  <text x="500" y="530" text-anchor="middle" font-size="13" fill="#374151">Her koşu bir audit.json bırakır; karşılaştırma sitesi her belgeyi bu sayılarla yayınlar.</text>
  <text x="500" y="558" text-anchor="middle" font-size="13" fill="#374151">Korunan değerler (sayı, ölçü, DOI, URL, Romen rakamı) modele hiç gösterilmez.</text>
  <text x="500" y="592" text-anchor="middle" font-size="12" fill="#9ca3af">Şema depodaki kodun akışını yansıtır — ölçümler docs/STORY.md ve docs/MEASUREMENTS.md'de.</text>
</svg>
