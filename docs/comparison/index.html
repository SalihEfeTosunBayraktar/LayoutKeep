<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayoutKeep - orijinal / çeviri karşılaştırması</title>
<style>
  :root { color-scheme: dark; --ink:#e8eaed; --muted:#9aa0a6; --line:#2b2f36; --accent:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; background:#0f1115; color:var(--ink); }
  header { padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#0f1115f2; backdrop-filter:blur(6px); z-index:5; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 260px 1fr; gap:0; min-height: calc(100vh - 74px); }
  nav { border-right:1px solid var(--line); padding:12px; overflow:auto; max-height: calc(100vh - 74px); }
  nav button { display:block; width:100%; text-align:left; margin:0 0 6px; padding:8px 10px; border:1px solid var(--line);
                border-radius:8px; background:#151922; color:var(--ink); cursor:pointer; font:inherit; }
  nav button.active { border-color:var(--accent); background:#1b2433; }
  nav button small { display:block; color:var(--muted); font-size:11px; }
  section { padding:16px 20px 40px; }
  h2 { font-size:16px; margin:4px 0 2px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .stage { position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#14171d;
            touch-action:none; cursor:ew-resize; }
  .stage img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  .stage .after { position:absolute; inset:0; }
  .stage .before { position:relative; z-index:2; clip-path: inset(0 50% 0 0); }
  .handle { position:absolute; top:0; bottom:0; left:50%; width:2px; background:var(--accent); z-index:3; }
  .handle::after { content:""; position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px;
                    border-radius:50%; border:2px solid var(--accent); background:#0f1115cc; }
  .tag { position:absolute; top:10px; padding:3px 8px; border-radius:6px; font-size:12px; background:#0f1115cc; z-index:4; }
  .tag.a { left:10px; } .tag.b { right:10px; }
  .pages { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; }
  .pages button { padding:5px 9px; border-radius:6px; border:1px solid var(--line); background:#151922; color:var(--ink); cursor:pointer; font:inherit; font-size:13px; }
  .pages button.active { border-color:var(--accent); background:#1b2433; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>LayoutKeep — orijinal ve çeviri, yan yana</h1>
  <div class="sub">Ayırıcıyı sürükle (ya da ← → tuşları): solda orijinal, sağda çevrilmiş sayfa. 18 belge.</div>
</header>
<main>
  <nav id="docs"></nav>
  <section>
    <h2 id="title"></h2>
    <div class="meta" id="meta"></div>
    <div class="stage" id="stage">
      <img class="before" id="before" alt="orijinal sayfa">
      <div class="after"><img id="after" alt="çevrilmiş sayfa"></div>
      <div class="tag a">orijinal</div>
      <div class="tag b">çeviri</div>
      <div class="handle" id="handle"></div>
    </div>
    <div class="pages" id="pages"></div>
    <div class="hint">Görseller 92 dpi. Kaynak: _artifacts/heldout/sources + runs + live.</div>
  </section>
</main>
<script>
const DATA = [{"title": "arxiv 19113", "losses": "D1 96, D2 28, D3 0, L1 0, L2 1, L3 0, L4 0, L5 0, L6 7, L7 1, L8 0, L9 0", "note": "", "pages": [{"page": 1, "before": "img/arxiv_19113/0000_a.jpg", "after": "img/arxiv_19113/0000_b.jpg"}, {"page": 7, "before": "img/arxiv_19113/0006_a.jpg", "after": "img/arxiv_19113/0006_b.jpg"}, {"page": 12, "before": "img/arxiv_19113/0011_a.jpg", "after": "img/arxiv_19113/0011_b.jpg"}, {"page": 18, "before": "img/arxiv_19113/0017_a.jpg", "after": "img/arxiv_19113/0017_b.jpg"}, {"page": 23, "before": "img/arxiv_19113/0022_a.jpg", "after": "img/arxiv_19113/0022_b.jpg"}, {"page": 29, "before": "img/arxiv_19113/0028_a.jpg", "after": "img/arxiv_19113/0028_b.jpg"}]}, {"title": "arxiv 19145", "losses": "D1 296, D2 7, D3 2, L1 1, L2 7, L3 0, L4 0, L5 0, L6 2, L7 1, L8 2, L9 0", "note": "", "pages": [{"page": 1, "before": "img/arxiv_19145/0000_a.jpg", "after": "img/arxiv_19145/0000_b.jpg"}, {"page": 5, "before": "img/arxiv_19145/0004_a.jpg", "after": "img/arxiv_19145/0004_b.jpg"}, {"page": 8, "before": "img/arxiv_19145/0007_a.jpg", "after": "img/arxiv_19145/0007_b.jpg"}, {"page": 12, "before": "img/arxiv_19145/0011_a.jpg", "after": "img/arxiv_19145/0011_b.jpg"}, {"page": 15, "before": "img/arxiv_19145/0014_a.jpg", "after": "img/arxiv_19145/0014_b.jpg"}, {"page": 19, "before": "img/arxiv_19145/0018_a.jpg", "after": "img/arxiv_19145/0018_b.jpg"}]}, {"title": "cookbook 1907", "losses": "D1 129, D2 0, D3 1, L1 0, L2 1, L3 0, L4 0, L5 0, L6 1, L7 0, L8 0, L9 0", "note": "", "pages": [{"page": 1, "before": "img/cookbook_1907/0000_a.jpg", "after": "img/cookbook_1907/0000_b.jpg"}, {"page": 8, "before": "img/cookbook_1907/0007_a.jpg", "after": "img/cookbook_1907/0007_b.jpg"}, {"page": 15, "before": "img/cookbook_1907/0014_a.jpg", "after": "img/cookbook_1907/0014_b.jpg"}, {"page": 21, "before": "img/cookbook_1907/0020_a.jpg", "after": "img/cookbook_1907/0020_b.jpg"}, {"page": 28, "before": "img/cookbook_1907/0027_a.jpg", "after": "img/cookbook_1907/0 after": "img/mushrooms_1895_sample/0024_b.jpg"}, {"page": 33, "before": "img/mushrooms_1895_sample/0032_a.jpg", "after": "img/mushrooms_1895_sample/0032_b.jpg"}, {"page": 41, "before": "img/mushrooms_1895_sample/0040_a.jpg", "after": "img/mushrooms_1895_sample/0040_b.jpg"}]}, {"title": "nasa ntrs scan", "losses": "D1 6, D2 0, D3 0, L1 0, L2 1, L3 0, L4 0, L5 0, L6 0, L7 0, L8 0, L9 0", "note": "", "pages": [{"page": 1, "before": "img/nasa_ntrs_scan/0000_a.jpg", "after": "img/nasa_ntrs_scan/0000_b.jpg"}]}, {"title": "plos animal movement", "losses": "D1 102, D2 84, D3 0, L1 0, L2 3, L3 8, L4 0, L5 0, L6 0, L7 0, L8 0, L9 0", "note": "", "pages": [{"page": 1, "before": "img/plos_animal_movement/0000_a.jpg", "after": "img/plos_animal_movement/0000_b.jpg"}, {"page": 7, "before": "img/plos_animal_movement/0006_a.jpg", "after": "img/plos_animal_movement/0006_b.jpg"}, {"page": 13, "before": "img/plos_animal_movement/0012_a.jpg", "after": "img/plos_animal_movement/0012_b.jpg"}, {"page": 18, "before": "img/plos_animal_movement/0017_a.jpg", "after": "img/plos_animal_movement/0017_b.jpg"}, {"page": 24, "before": "img/plos_animal_movement/0023_a.jpg", "after": "img/plos_animal_movement/0023_b.jpg"}, {"page": 30, "before": "img/plos_animal_movement/0029_a.jpg", "after": "img/plos_animal_movement/0029_b.jpg"}]}, {"title": "wikipedia photosynthesis", "losses": "D1 24, D2 11, D3 1, L1 0, L2 5, L3 0, L4 0, L5 0, L6 1, L7 0, L8 0, L9 0", "note": "", "pages": [{"page": 1, "before": "img/wikipedia_photosynthesis/0000_a.jpg", "after": "img/wikipedia_photosynthesis/0000_b.jpg"}, {"page": 7, "before": "img/wikipedia_photosynthesis/0006_a.jpg", "after": "img/wikipedia_photosynthesis/0006_b.jpg"}, {"page": 14, "before": "img/wikipedia_photosynthesis/0013_a.jpg", "after": "img/wikipedia_photosynthesis/0013_b.jpg"}, {"page": 20, "before": "img/wikipedia_photosynthesis/0019_a.jpg", "after": "img/wikipedia_photosynthesis/0019_b.jpg"}, {"page": 27, "before": "img/wikipedia_photosynthesis/0026_a.jpg", "after": "img/wikipedia_photosynthesis/0026_b.jpg"}, {"page": 33, "before": "img/wikipedia_photosynthesis/0032_a.jpg", "after": "img/wikipedia_photosynthesis/0032_b.jpg"}]}, {"title": "wikipedia printing press", "losses": "D1 8, D2 20, D3 0, L1 1, L2 4, L3 0, L4 0, L5 0, L6 0, L7 0, L8 0, L9 0", "note": "", "pages": [{"page": 1, "before": "img/wikipedia_printing_press/0000_a.jpg", "after": "img/wikipedia_printing_press/0000_b.jpg"}, {"page": 4, "before": "img/wikipedia_printing_press/0003_a.jpg", "after": "img/wikipedia_printing_press/0003_b.jpg"}, {"page": 8, "before": "img/wikipedia_printing_press/0007_a.jpg", "after": "img/wikipedia_printing_press/0007_b.jpg"}, {"page": 11, "before": "img/wikipedia_printing_press/0010_a.jpg", "after": "img/wikipedia_printing_press/0010_b.jpg"}, {"page": 15, "before": "img/wikipedia_printing_press/0014_a.jpg", "after": "img/wikipedia_printing_press/0014_b.jpg"}, {"page": 18, "before": "img/wikipedia_printing_press/0017_a.jpg", "after": "img/wikipedia_printing_press/0017_b.jpg"}]}, {"title": "fresh_pdfmt_r5 parça 0", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r5_0/0000_a.jpg", "after": "img/fresh_pdfmt_r5_0/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r5 parça 1", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r5_1/0000_a.jpg", "after": "img/fresh_pdfmt_r5_1/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r5 parça 2", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r5_2/0000_a.jpg", "after": "img/fresh_pdfmt_r5_2/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r5 parça 3", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r5_3/0000_a.jpg", "after": "img/fresh_pdfmt_r5_3/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r6 parça 0", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r6_0/0000_a.jpg", "after": "img/fresh_pdfmt_r6_0/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r6 parça 1", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r6_1/0000_a.jpg", "after": "img/fresh_pdfmt_r6_1/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r6 parça 2", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r6_2/0000_a.jpg", "after": "img/fresh_pdfmt_r6_2/0000_b.jpg"}]}, {"title": "fresh_pdfmt_r6 parça 3", "losses": "", "note": "en güncel kod, gerçek model", "pages": [{"page": 1, "before": "img/fresh_pdfmt_r6_3/0000_a.jpg", "after": "img/fresh_pdfmt_r6_3/0000_b.jpg"}]}];

let current = 0, page = 0, dragging = false, ratio = 0.5;
const $ = (id) => document.getElementById(id);

function setRatio(value) {
  ratio = Math.min(1, Math.max(0, value));
  $("before").style.clipPath = `inset(0 ${(1 - ratio) * 100}% 0 0)`;
  $("handle").style.left = `${ratio * 100}%`;
}

function showDocument(index) {
  current = index; page = 0;
  const doc = DATA[index];
  $("title").textContent = doc.title;
  $("meta").textContent = [doc.pages.length + " sayfa", doc.losses, doc.note].filter(Boolean).join(" · ");
  $("pages").replaceChildren(...doc.pages.map((record, i) => {
    const button = document.createElement("button");
    button.textContent = record.page;
    button.onclick = () => showPage(i);
    return button;
  }));
  [...$("docs").children].forEach((child, i) => child.classList.toggle("active", i === index));
  showPage(0);
}

function showPage(index) {
  page = index;
  const record = DATA[current].pages[index];
  $("before").src = record.before;
  $("after").src = record.after;
  [...$("pages").children].forEach((child, i) => child.classList.toggle("active", i === index));
}

const stage = $("stage");
const move = (event) => {
  const box = stage.getBoundingClientRect();
  const x = (event.touches ? event.touches[0].clientX : event.clientX) - box.left;
  setRatio(x / box.width);
};
stage.addEventListener("pointerdown", (event) => { dragging = true; move(event); });
window.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("pointermove", (event) => { if (dragging) move(event); });
window.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") showPage(Math.max(0, page - 1));
  if (event.key === "ArrowRight") showPage(Math.min(DATA[current].pages.length - 1, page + 1));
});

const nav = $("docs");
DATA.forEach((doc, index) => {
  const button = document.createElement("button");
  button.innerHTML = `${doc.title}<small>${doc.pages.length} sayfa</small>`;
  button.onclick = () => showDocument(index);
  nav.append(button);
});
setRatio(0.5);
showDocument(0);
</script>
</body>
</html>
